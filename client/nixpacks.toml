# Nixpacks config for the Vite client
# Force modern Node because Vite 8 + React Router 7 + Rolldown require >=20.19

[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['npm ci --include=dev']

[phases.build]
cmds = ['npm run build']

# For platforms that need an explicit start (many auto-detect static 'dist' folder)
[start]
cmd = 'npx serve dist -l $PORT'
