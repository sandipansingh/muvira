# Nixpacks configuration (for when build root is the monorepo root)
# We force Node 20+ and run all steps inside the client/ folder.

[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['cd client && npm ci --include=dev']

[phases.build]
cmds = ['cd client && npm run build']

[start]
cmd = 'npx serve client/dist -l 3000'
