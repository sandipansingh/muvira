name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Build API for integration tests
        run: npm run build
        working-directory: server
      - name: Start local Supabase
        run: npm run db:start
      - name: Replay migrations from scratch
        run: npm run db:reset
      - name: Verify schema grants, RLS, policies, and constraints
        run: npm run db:test
      - name: Verify live database and API contracts
        shell: bash
        run: |
          cd server
          npx supabase status --workdir .. -o env > ../supabase/.temp/test-status.env
          cd ..
          source supabase/.temp/test-status.env
          SUPABASE_TEST_URL="$API_URL" \
          SUPABASE_TEST_ANON_KEY="$ANON_KEY" \
          SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node --test tests/database-security.test.cjs tests/api-integration.test.cjs
      - name: Replay remediation as an upgrade from migration 025
        shell: bash
        run: |
          cd server
          npx supabase db reset --workdir .. --local --no-seed --version 025
          npx supabase migration up --workdir .. --local
      - name: Verify upgraded schema invariants
        run: npm run db:test
      - name: Stop local Supabase
        if: always()
        run: npm run db:stop
