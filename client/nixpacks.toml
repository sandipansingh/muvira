# Nixpacks config for the Vite client
# Force modern Node because Vite 8 + React Router 7 + Rolldown require >=20.19

[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['corepack enable', 'pnpm install --frozen-lockfile']

[phases.build]
cmds = ['pnpm --filter client build']

[start]
cmd = 'node client/scripts/serve-static.mjs'
