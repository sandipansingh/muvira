name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run type-check
      - run: pnpm run test

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build API for integration tests
        run: pnpm --filter server build
      - name: Start local Supabase
        run: pnpm run db:start
      - name: Replay migrations from scratch
        run: pnpm run db:reset
      - name: Verify schema grants, RLS, policies, and constraints
        run: pnpm run db:test
      - name: Verify live database and API contracts
        shell: bash
        run: |
          pnpm --filter server exec supabase status --workdir .. -o env > supabase/.temp/test-status.env
          source supabase/.temp/test-status.env
          SUPABASE_TEST_URL="$API_URL" \
          SUPABASE_TEST_ANON_KEY="$ANON_KEY" \
          SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node --test tests/database-security.test.cjs tests/api-integration.test.cjs
      - name: Replay remediation as an upgrade from migration 025
        shell: bash
        run: |
          pnpm --filter server exec supabase db reset --workdir .. --local --no-seed --version 025
          source supabase/.temp/test-status.env
          EXPECTED_SCHEMA_READY=false \
          SUPABASE_TEST_URL="$API_URL" \
          SUPABASE_TEST_ANON_KEY="$ANON_KEY" \
          SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node --test tests/schema-readiness.test.cjs
          pnpm --filter server exec supabase migration up --workdir .. --local
      - name: Verify upgraded schema invariants
        run: pnpm run db:test
      - name: Verify upgraded runtime readiness
        shell: bash
        run: |
          source supabase/.temp/test-status.env
          EXPECTED_SCHEMA_READY=true \
          SUPABASE_TEST_URL="$API_URL" \
          SUPABASE_TEST_ANON_KEY="$ANON_KEY" \
          SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          node --test tests/schema-readiness.test.cjs
      - name: Stop local Supabase
        if: always()
        run: pnpm run db:stop
